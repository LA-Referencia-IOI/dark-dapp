services:
  # ═══════════════════════════════════════════════════════════════
  # BESU VALIDATOR NODES (QBFT POA)
  # All validators start together - they find each other via static enode URLs
  # ═══════════════════════════════════════════════════════════════

  validator1:
    image: hyperledger/besu:latest
    container_name: validator1
    command:
      - --data-path=/opt/besu/data
      - --genesis-file=/config/genesis.json
      - --node-private-key-file=/config/keys/0x39e4879cbe76a47fdcfceb3bdbc256d5a7b5a0be/key
      - --rpc-http-enabled
      - --rpc-http-api=ETH,NET,WEB3,QBFT,ADMIN,DEBUG,TXPOOL
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-cors-origins=*
      - --host-allowlist=*
      - --p2p-host=0.0.0.0
      - --p2p-port=30303
      - --min-gas-price=0
      - --sync-min-peers=0
    volumes:
      - ./docker/besu/networkFiles/genesis.json:/config/genesis.json:ro
      - ./docker/besu/networkFiles/keys:/config/keys:ro
      - validator1-data:/opt/besu/data
    ports:
      - "8545:8545"
      - "30303:30303"
    networks:
      besu-network:
        ipv4_address: 172.16.239.11

  validator2:
    image: hyperledger/besu:latest
    container_name: validator2
    command:
      - --data-path=/opt/besu/data
      - --genesis-file=/config/genesis.json
      - --node-private-key-file=/config/keys/0xc2719a9bad74663c6d52c483c0ddfcf8a013522e/key
      - --p2p-host=0.0.0.0
      - --p2p-port=30303
      - --min-gas-price=0
      - --sync-min-peers=0
      - --bootnodes=enode://318cdb54b50dc1789f46a786c89b3ce433278866ca5068d74b78ed67889b40c03f49d13f4900a1c3ceb389e27a972bc890fc3e9ceeb987e9a9b2d197b2ba261e@172.16.239.11:30303
    volumes:
      - ./docker/besu/networkFiles/genesis.json:/config/genesis.json:ro
      - ./docker/besu/networkFiles/keys:/config/keys:ro
      - validator2-data:/opt/besu/data
    networks:
      besu-network:
        ipv4_address: 172.16.239.12

  validator3:
    image: hyperledger/besu:latest
    container_name: validator3
    command:
      - --data-path=/opt/besu/data
      - --genesis-file=/config/genesis.json
      - --node-private-key-file=/config/keys/0xfe1d009479df351916e8f20a56d11f7c5d58ebdd/key
      - --p2p-host=0.0.0.0
      - --p2p-port=30303
      - --min-gas-price=0
      - --sync-min-peers=0
      - --bootnodes=enode://318cdb54b50dc1789f46a786c89b3ce433278866ca5068d74b78ed67889b40c03f49d13f4900a1c3ceb389e27a972bc890fc3e9ceeb987e9a9b2d197b2ba261e@172.16.239.11:30303
    volumes:
      - ./docker/besu/networkFiles/genesis.json:/config/genesis.json:ro
      - ./docker/besu/networkFiles/keys:/config/keys:ro
      - validator3-data:/opt/besu/data
    networks:
      besu-network:
        ipv4_address: 172.16.239.13

  # ═══════════════════════════════════════════════════════════════
  # DARK DEPLOY CONTAINER
  # Wait 30s for all validators to connect and reach consensus
  # ═══════════════════════════════════════════════════════════════

  dark-deploy:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: dark-deploy
    volumes:
      - .:/usr/src/dark
    working_dir: /usr/src/dark
    networks:
      - besu-network
    environment:
      - PYTHONUNBUFFERED=1
    command: >
      sh -c "echo 'Waiting 30s for QBFT validators to connect...' && sleep 30 && python3 deploy.py && python3 configure.py"

# ═══════════════════════════════════════════════════════════════
# NETWORKS & VOLUMES
# ═══════════════════════════════════════════════════════════════

networks:
  besu-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.16.239.0/24

volumes:
  validator1-data:
  validator2-data:
  validator3-data:
